<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="description" content="PHLife — Live your LIFESTYLE. A Port Harcourt life simulation game.">
<title>PHLife — Live your LIFESTYLE</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--bg:#080b10;--card:#111722;--text:#f5f7fb;--muted:#8d99aa;--accent:#20d47a;--line:#253043}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#20304a 0,#0b0f14 42%,#06080c 100%);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
.app{max-width:720px;margin:auto;min-height:100vh;padding:18px 16px 90px}.brand{display:flex;align-items:center;justify-content:space-between;margin:8px 0 22px}
.logo{font-weight:900;font-size:30px;letter-spacing:-1.5px}.logo span{color:var(--accent)}.pill{border:1px solid var(--line);background:#0e141d;padding:8px 11px;border-radius:999px;color:var(--muted);font-size:12px}
.hero{padding:26px 4px 20px}.eyebrow{color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:2px;font-size:12px}
.hero h1{font-size:clamp(38px,10vw,68px);line-height:.94;margin:10px 0 16px;letter-spacing:-3px}.hero p,.muted{color:#aeb8c7;line-height:1.55}
.card{background:linear-gradient(180deg,#141b27,#0f151e);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 16px 50px #0005;margin:14px 0}
.btn{width:100%;border:0;border-radius:15px;padding:15px 18px;font-weight:850;color:#06110a;background:var(--accent);margin-top:10px}.secondary{background:#202a38;color:var(--text);border:1px solid #334157}
.field{margin:12px 0}.field label{display:block;color:#aeb8c7;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
input,select{width:100%;background:#0a0f16;color:var(--text);border:1px solid #2c394d;border-radius:13px;padding:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scene{height:220px;border-radius:20px;border:1px solid var(--line);overflow:hidden;position:relative;background:linear-gradient(#18283c 0 52%,#152118 52% 100%)}
.sun{position:absolute;width:58px;height:58px;border-radius:50%;background:#ffd66e;right:34px;top:28px}.building{position:absolute;bottom:0;width:58%;height:64%;left:21%;background:#b9794e;clip-path:polygon(50% 0,100% 28%,100% 100%,0 100%,0 28%)}
.door{position:absolute;bottom:0;left:44%;width:13%;height:28%;background:#30241f}.tree{position:absolute;bottom:0;width:28px;height:90px;background:#51392c}.tree:before{content:"";position:absolute;width:78px;height:78px;background:#315e43;border-radius:50%;left:-25px;top:-55px}.t1{left:8%}.t2{right:9%}
.stats,.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0b1017;border:1px solid var(--line);padding:13px 8px;border-radius:14px;text-align:center}.stat b{display:block;font-size:18px}.stat small{color:var(--muted)}
.actiongrid,.mapgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.action,.place{background:#151e2a;color:var(--text);border:1px solid #2b394d;border-radius:14px;padding:14px;font-weight:800}.place{text-align:left;min-height:95px}.place span{display:block;color:var(--muted);font-size:12px;margin-top:6px}
.bar{height:7px;background:#252f3d;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.notice{padding:12px;border-radius:14px;background:#14281d;border:1px solid #205c3a;color:#bceccf;margin:12px 0;font-size:13px}
.analysis{text-align:center;padding:50px 12px}.loader{width:54px;height:54px;border:4px solid #263244;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 22px}@keyframes spin{to{transform:rotate(360deg)}}
.terminal{color:#9eabbc;font-family:monospace;line-height:2;font-size:13px}.origin{display:inline-block;padding:8px 12px;border-radius:999px;background:#163925;color:var(--accent);font-weight:900;font-size:12px;letter-spacing:1px}
.reveal{text-align:center}.reveal h2{font-size:42px;margin:14px 0 8px;letter-spacing:-2px}.feed{padding:11px 0;border-bottom:1px solid #202a38;color:#b6c0ce;font-size:13px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b1017ee;border-top:1px solid var(--line);padding:9px max(14px,calc((100vw - 720px)/2));display:grid;grid-template-columns:repeat(4,1fr);z-index:5}
.nav{background:none;border:0;color:#7f8b9c;padding:8px;font-size:11px;font-weight:800}.nav.active{color:var(--accent)}.nav strong{display:block;font-size:19px}
@media(max-width:480px){.grid{grid-template-columns:1fr}.hero h1{font-size:48px}}
</style>
</head>
<body><main id="app" class="app"></main>
<script>
const origins={
"Lapo":{desc:"You grew up close to the grind. Money was tight, resilience was normal, and hustle became part of your language.",home:"Diobu",cash:12000,career:"Hustler"},
"Gen Z":{desc:"You were born into an ordinary modern life: enough comfort to dream, but enough reality to make your choices matter.",home:"Rumuola",cash:85000,career:"Student / Starter"},
"Old Taker":{desc:"Your family story remembers serious money. The flashy years faded, but the contacts, confidence and scars remained.",home:"D-Line",cash:180000,career:"Independent"},
"New Taker":{desc:"Your household recently entered serious money. Everything feels bigger, faster and more expensive.",home:"New GRA",cash:4500000,career:"Entrepreneur"},
"Nepo":{desc:"You were born into wealth, property and access. Doors tend to open before you reach them.",home:"Old GRA",cash:9000000,career:"Heir / Founder"}};
let s={page:"landing",player:null,cash:0,hunger:80,energy:90,mood:82,time:8,day:1,place:"Home",feed:[]};
const app=()=>document.getElementById("app");
function render(){app().innerHTML=s.page==="landing"?landing():s.page==="creator"?creator():s.page==="analysis"?analysis():s.page==="reveal"?reveal():game();if(s.page==="game")nav();}
function landing(){return `<div class="brand"><div class="logo">PH<span>Life</span></div><div class="pill">PORT HARCOURT • BETA</div></div><section class="hero"><div class="eyebrow">Live your LIFESTYLE.</div><h1>Your city.<br>Your choices.<br>Your story.</h1><p>Create yourself, let PHLife analyze your background, then discover the life you were born into.</p></section><div class="card"><div class="scene"><div class="sun"></div><div class="building"></div><div class="door"></div><div class="tree t1"></div><div class="tree t2"></div></div><button class="btn" onclick="page('creator')">Create my life</button><button class="btn secondary" onclick="demo()">Play demo life</button></div><div class="card"><b>PHLife v0.1 • First playable build</b><p class="muted">Automatic background assignment • Port Harcourt districts • needs • cash • jobs • map • phone events • PWA-ready.</p></div>`}
function creator(){return `<div class="brand"><div class="logo">PH<span>Life</span></div><div class="pill">LIFE CREATOR</div></div><div class="card"><div class="eyebrow">Step 01</div><h2>Create yourself</h2><p class="muted">Don't choose your background. Tell PHLife about yourself and let it decide where your story begins.</p><div class="field"><label>Your name</label><input id="name" placeholder="e.g. Richie Nelson"></div><div class="grid"><div class="field"><label>Birthday</label><input id="dob" type="date"></div><div class="field"><label>Birthplace</label><select id="birth"><option>Port Harcourt</option><option>Rivers State</option><option>Lagos</option><option>Other Nigeria</option></select></div></div><div class="field"><label>Family wealth while growing up</label><select id="wealth"><option value="low">Low / money was tight</option><option value="average">Average / comfortable</option><option value="high">High / wealthy family</option><option value="new">Recently became wealthy</option><option value="fallen">Family once had serious money</option></select></div><div class="field"><label>Childhood</label><select id="child"><option value="grind">Hustle and survival</option><option value="normal">Normal modern childhood</option><option value="luxury">Comfort and luxury</option><option value="connected">Private schools / strong connections</option></select></div><button class="btn" onclick="analyze()">Analyze my life</button></div>`}
function analysis(){return `<div class="card analysis"><div class="loader"></div><div class="eyebrow">PHLife Intelligence</div><h2>ACCESSING PERSONAL RECORD…</h2><div id="terminal" class="terminal">ANALYZING FAMILY HISTORY…</div></div>`}
function analyze(){const n=document.getElementById("name").value.trim()||"Player",w=document.getElementById("wealth").value,c=document.getElementById("child").value;let o=w==="fallen"?"Old Taker":w==="new"?"New Taker":w==="low"&&c==="grind"?"Lapo":(c==="connected"||w==="high")?"Nepo":"Gen Z";s.player={name:n,origin:o};page("analysis");const lines=["ACCESSING PERSONAL RECORD…","ANALYZING FAMILY HISTORY…","ANALYZING CHILDHOOD…","ANALYZING SOCIAL ACCESS…","GENERATING BACKGROUND…"];let i=0,t=setInterval(()=>{const x=document.getElementById("terminal");if(x)x.textContent=lines[Math.min(i++,4)];if(i>5){clearInterval(t);page("reveal")}},650)}
function reveal(){let p=s.player,o=origins[p.origin];return `<div class="card reveal"><div class="eyebrow">BACKGROUND GENERATED</div><div class="origin">${p.origin.toUpperCase()}</div><h2>${p.name}</h2><p class="muted">${o.desc}</p><div class="stats"><div class="stat"><b>₦${o.cash.toLocaleString()}</b><small>Starting cash</small></div><div class="stat"><b>${o.home}</b><small>Starting home</small></div><div class="stat"><b>${o.career}</b><small>Career path</small></div></div><div class="notice">PHLife chose your origin from the information you gave us. This is where your story begins.</div><button class="btn" onclick="enter()">Wake up in Port Harcourt</button></div>`}
function enter(){let o=origins[s.player.origin];s.cash=o.cash;s.feed=["You wake up in "+o.home+", Port Harcourt.","Your background: "+s.player.origin+".","PHLife has started your Day 1."];page("game")}
function demo(){s.player={name:"Richie",origin:"Gen Z"};s.cash=85000;s.feed=["Welcome to PHLife. This is a demo life."];page("game")}
function game(){return `<div class="brand"><div class="logo">PH<span>Life</span></div><div class="pill">DAY ${s.day} • ${String(s.time).padStart(2,"0")}:00</div></div><div class="hud"><div class="stat"><b>₦${Math.round(s.cash).toLocaleString()}</b><small>Cash</small></div><div class="stat"><b>${s.mood}%</b><small>Mood</small></div><div class="stat"><b>${s.place}</b><small>Location</small></div></div><div class="card"><div class="scene"><div class="sun"></div><div class="building"></div><div class="door"></div><div class="tree t1"></div><div class="tree t2"></div></div><h2>Good morning, ${s.player.name}.</h2><p class="muted">${s.player.origin} • ${origins[s.player.origin].career}</p><div class="field"><label>Hunger ${s.hunger}%</label><div class="bar"><i style="width:${s.hunger}%"></i></div></div><div class="field"><label>Energy ${s.energy}%</label><div class="bar"><i style="width:${s.energy}%"></i></div></div><div class="actiongrid"><button class="action" onclick="act('eat')">🍲 Eat</button><button class="action" onclick="act('work')">💼 Work</button><button class="action" onclick="act('social')">💬 Socialize</button><button class="action" onclick="act('rest')">🛏 Rest</button></div></div><div class="card"><b>Life feed</b>${s.feed.slice(-5).reverse().map(x=>`<div class="feed">${x}</div>`).join("")}</div><div id="panel"></div>`}
function nav(){const b=document.createElement("div");b.className="bottom";b.innerHTML=`<button class="nav active" onclick="panel('home')"><strong>⌂</strong>Home</button><button class="nav" onclick="panel('life')"><strong>♙</strong>Life</button><button class="nav" onclick="panel('map')"><strong>⌖</strong>Map</button><button class="nav" onclick="panel('phone')"><strong>▣</strong>Phone</button>`;document.body.appendChild(b)}
function panel(x){let p=document.getElementById("panel");if(x==="home"){p.innerHTML="";return}if(x==="life")p.innerHTML=`<div class="card"><div class="eyebrow">Your life</div><h2>${s.player.name}</h2><p class="muted">Background: <b>${s.player.origin}</b><br>Career: ${origins[s.player.origin].career}<br>Home: ${origins[s.player.origin].home}</p></div>`;if(x==="map")p.innerHTML=`<div class="card"><div class="eyebrow">Port Harcourt</div><h2>City map</h2><div class="mapgrid">${[["Town","Business • government"],["Diobu","Markets • hustle"],["Old GRA","Luxury • status"],["New GRA","Apartments • nightlife"],["Trans-Amadi","Industry • jobs"],["Choba","UniPort • campus"],["Woji","Residential • social"],["Rumuokoro","Transport • commerce"]].map(a=>`<button class="place" onclick="travel('${a[0]}')"><b>${a[0]}</b><span>${a[1]}</span></button>`).join("")}</div></div>`;if(x==="phone")p.innerHTML=`<div class="card"><div class="eyebrow">PHPhone</div><h2>Your city in your pocket</h2><p class="muted">PHChat • PHJobs • PHCampus • PHNews • PHProperty • PHRide</p><div class="notice">A new contact from your ${s.player.origin} network is waiting to hear from you.</div></div>`}
function travel(x){s.place=x;s.time++;s.energy=Math.max(0,s.energy-4);s.feed.push("You travelled to "+x+".");render()}
function act(a){if(a==="eat"){s.cash=Math.max(0,s.cash-1800);s.hunger=Math.min(100,s.hunger+28);s.time++;s.feed.push("You grabbed a quick meal. -₦1,800.")}if(a==="work"){let g=s.player.origin==="Lapo"?15000:s.player.origin==="New Taker"?95000:35000;s.cash+=g;s.energy=Math.max(0,s.energy-22);s.hunger=Math.max(0,s.hunger-12);s.time+=3;s.feed.push("A work opportunity paid ₦"+g.toLocaleString()+".")}if(a==="social"){s.cash=Math.max(0,s.cash-5000);s.mood=Math.min(100,s.mood+15);s.time+=2;s.feed.push("You met someone new. Your social network grew.")}if(a==="rest"){s.energy=Math.min(100,s.energy+35);s.mood=Math.min(100,s.mood+6);s.time+=2;s.feed.push("You rested at home and recovered energy.")}if(s.time>=24){s.day++;s.time=8}s.hunger=Math.max(0,s.hunger-2);render()}
function page(x){s.page=x;render()}
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
render();
</script></body></html>
